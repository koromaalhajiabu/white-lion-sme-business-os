<style>
:root{--navy:#101b31;--navy2:#172844;--gold:#d6ad57;--gold2:#f0d28b;--bg:#f3f5f9;--ink:#172238;--muted:#718096;--line:#e4e9f1;--white:#fff;--green:#16865b;--red:#c94c55;--blue:#3478d4;--shadow:0 12px 32px rgba(16,27,49,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.app{min-height:100vh;display:grid;grid-template-columns:248px 1fr}.sidebar{background:linear-gradient(180deg,var(--navy),#0b1425);color:#fff;padding:22px 15px;display:flex;flex-direction:column;gap:22px}.brand{display:flex;align-items:center;gap:11px;padding:2px 8px}.brand-mark{width:39px;height:39px;border-radius:12px;background:linear-gradient(135deg,var(--gold2),var(--gold));display:grid;place-items:center;color:var(--navy);font-weight:900;font-size:19px}.brand strong{display:block;font-size:13px;letter-spacing:1.1px}.brand small{color:#b8c4d8;font-size:10px;letter-spacing:1.5px}.business-switch{background:#1b2b47;border:1px solid #31415c;border-radius:12px;padding:12px;color:#fff}.business-switch small{color:#aebbd0;display:block;font-size:10px;text-transform:uppercase;letter-spacing:1px}.business-switch b{display:block;margin-top:4px}.nav-label{color:#8291aa;font-size:10px;text-transform:uppercase;letter-spacing:1.4px;padding:0 10px;margin:2px 0 7px}.nav{display:grid;gap:5px}.nav button{border:0;background:transparent;color:#c6d0df;text-align:left;padding:10px 12px;border-radius:9px;display:flex;align-items:center;gap:11px;font-weight:550}.nav button:hover,.nav button.active{background:#263955;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--gold)}.nav .ico{width:18px;text-align:center;color:var(--gold2)}.side-foot{margin-top:auto;color:#8493aa;font-size:11px;padding:10px}.main{min-width:0}.topbar{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:5}.crumb{font-weight:700;font-size:16px}.top-actions{display:flex;align-items:center;gap:12px}.status{display:flex;align-items:center;gap:7px;color:var(--green);font-size:12px;font-weight:700}.dot{width:8px;height:8px;background:#23ad77;border-radius:50%}.avatar{width:34px;height:34px;border-radius:50%;background:#f5e8c9;color:#6c5019;display:grid;place-items:center;font-weight:800}.content{padding:28px 30px 45px;max-width:1500px;margin:auto}.welcome{display:flex;justify-content:space-between;align-items:flex-start;gap:20px;margin-bottom:24px}.eyebrow{color:#9a762c;font-size:11px;letter-spacing:1.4px;text-transform:uppercase;font-weight:800}.welcome h1{font-size:27px;margin:5px 0 4px;letter-spacing:-.6px}.welcome p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:10px 14px;color:var(--ink);font-weight:700}.btn.primary{background:var(--navy);color:#fff;border-color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a2435}.btn.danger{color:var(--red)}.btn.small{padding:7px 10px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:20px}.stat,.panel,.module-card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}.stat{padding:17px 18px}.stat-head{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;font-weight:650}.stat-icon{width:31px;height:31px;border-radius:9px;background:#f8f1df;color:#8b6825;display:grid;place-items:center}.stat strong{display:block;font-size:25px;margin:12px 0 2px;letter-spacing:-.5px}.stat small{color:var(--muted);font-size:11px}.grid-main{display:grid;grid-template-columns:1.5fr 1fr;gap:17px}.panel{padding:18px;margin-bottom:17px;min-width:0}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:15px}.panel h3{margin:0;font-size:15px}.panel-sub{font-size:11px;color:var(--muted);margin-top:3px}.quick-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.quick{border:1px solid var(--line);border-radius:11px;padding:14px 10px;background:#fff;text-align:left}.quick:hover{border-color:var(--gold);background:#fffcf5}.quick span{display:block;font-size:19px;margin-bottom:7px}.quick b{font-size:12px}.quick small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap}th{text-align:left;color:#7c8798;font-size:10px;text-transform:uppercase;letter-spacing:.8px;padding:10px 9px;border-bottom:1px solid var(--line)}td{padding:12px 9px;border-bottom:1px solid #edf0f5;font-size:12px}tr:last-child td{border-bottom:0}.pill{display:inline-block;padding:4px 8px;border-radius:20px;font-size:10px;font-weight:800;background:#e8f6ef;color:#16865b}.pill.warn{background:#fff3dd;color:#9b6a10}.pill.neutral{background:#edf1f7;color:#607087}.empty{padding:25px;text-align:center;color:var(--muted);font-size:12px}.page-title{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:15px}.page-title h1{font-size:23px;margin:0}.page-title p{color:var(--muted);margin:4px 0 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap}.search{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;min-width:200px}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:11px;font-weight:750;color:#59677c}.field input,.field select,.field textarea{width:100%;border:1px solid #dce3ed;border-radius:9px;padding:10px 11px;background:#fff;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b58c3d;box-shadow:0 0 0 3px #d6ad5722}.modal-back{position:fixed;inset:0;background:#08132699;display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.modal-back.show{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:16px;padding:22px;box-shadow:0 25px 80px #0003;max-height:90vh;overflow:auto}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{font-size:18px;margin:0}.x{border:0;background:#f1f3f7;border-radius:8px;width:32px;height:32px;font-size:18px}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.notice{padding:12px 14px;border-radius:10px;background:#fff8e8;border:1px solid #f0dfb8;color:#75571c;font-size:12px;margin-bottom:16px}.industry-tags{display:flex;flex-wrap:wrap;gap:7px}.tag{background:#f2f4f8;border:1px solid #e4e9f1;border-radius:20px;padding:6px 9px;font-size:10px;color:#55647a}.report-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.report-box{padding:15px;background:#f7f8fb;border-radius:11px}.report-box small{color:var(--muted)}.report-box b{display:block;font-size:20px;margin-top:6px}.mobile-menu{display:none}.toast{position:fixed;bottom:20px;right:20px;background:#15243b;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:40;display:none}.toast.show{display:block}.footer{text-align:center;color:#98a2b2;font-size:10px;padding:20px}
@media(max-width:1050px){.app{grid-template-columns:215px 1fr}.stats{grid-template-columns:repeat(2,1fr)}.quick-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:720px){.app{display:block}.sidebar{position:fixed;z-index:15;left:-270px;top:0;bottom:0;width:250px;transition:left .2s}.sidebar.open{left:0}.topbar{height:60px;padding:0 15px}.mobile-menu{display:inline-flex}.content{padding:20px 14px 35px}.welcome{display:block}.welcome .btn{margin-top:13px}.welcome h1{font-size:23px}.grid-main{grid-template-columns:1fr}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:21px}.stat-icon{width:27px;height:27px}.quick-grid{gap:8px}.quick{padding:11px}.page-title{align-items:flex-start;flex-direction:column}.search{min-width:0;flex:1}.report-cards{grid-template-columns:1fr}.top-actions .status{display:none}}
</style>
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><div class="brand-mark">W</div><div><strong>WHITE LION</strong><small>BUSINESS SYSTEMS</small></div></div>
  <div class="business-switch"><small>Active business</small><b id="sideBusiness">My Business</b><span id="sideIndustry" style="font-size:10px;color:#b8c4d8">Multi-industry</span></div>
  <div><div class="nav-label">Workspace</div><nav class="nav" id="nav">
    <button class="active" data-page="dashboard"><span class="ico">▦</span>Overview</button>
    <button data-page="sales"><span class="ico">▣</span>Sales & POS</button>
    <button data-page="products"><span class="ico">◇</span>Products & Inventory</button>
    <button data-page="purchases"><span class="ico">⇩</span>Purchases</button>
    <button data-page="customers"><span class="ico">♙</span>Customers</button>
    <button data-page="suppliers"><span class="ico">♧</span>Suppliers</button>
    <button data-page="expenses"><span class="ico">↗</span>Expenses</button>
    <button data-page="reports"><span class="ico">▤</span>Reports</button>
  </nav></div>
  <div><div class="nav-label">Administration</div><nav class="nav">
    <button data-page="employees"><span class="ico">♟</span>Employees</button>
    <button data-page="settings"><span class="ico">⚙</span>Business settings</button>
  </nav></div>
  <div class="side-foot">White Lion Tech Solutions<br>SME Business OS · Starter build</div>
</aside>
<main class="main">
<header class="topbar">
  <div style="display:flex;align-items:center;gap:12px"><button class="btn small mobile-menu" id="menuBtn">☰</button><div class="crumb" id="crumb">Overview</div></div>
  <div class="top-actions"><div class="status"><span class="dot"></span><span id="connection">Offline-ready</span></div><div class="avatar">WL</div></div>
</header>
<section class="content" id="view"></section>
<div class="footer">Designed by Alhaji Abu Koroma · White Lion Tech Solutions</div>
</main>
</div>
<div class="modal-back" id="modalBack"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add record</h2><button class="x" id="closeModal">×</button></div><form id="modalForm"><div id="modalFields"></div><div class="modal-actions"><button type="button" class="btn" id="cancelModal">Cancel</button><button class="btn primary" type="submit">Save record</button></div></form></div></div>
<div class="toast" id="toast"></div>
<script>
const DB_NAME='whiteLionSME', DB_VERSION=1;
const stores=['products','sales','purchases','customers','suppliers','expenses','employees'];
let db, state={page:'dashboard',business:{name:'My Business',industry:'Multi-industry',currency:'SLE',email:'',phone:'',address:''}};
const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:state.business.currency||'SLE',maximumFractionDigits:2}).format(Number(n||0));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function openDB(){return new Promise((resolve,reject)=>{const r=indexedDB.open(DB_NAME,DB_VERSION);r.onupgradeneeded=()=>{const d=r.result;stores.forEach(s=>{if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'id',autoIncrement:true})});if(!d.objectStoreNames.contains('settings'))d.createObjectStore('settings',{keyPath:'key'})};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function all(store){return new Promise((resolve,reject)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function put(store,obj){return new Promise((resolve,reject)=>{const tx=db.transaction(store,'readwrite');const r=tx.objectStore(store).put(obj);r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function del(store,id){return new Promise((resolve,reject)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(Number(id));r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error)})}
async function setting(key,value){if(value!==undefined){await put('settings',{key,value});return value}const rows=await all('settings');return rows.find(x=>x.key===key)?.value}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2400)}
function setPage(p){state.page=p;document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===p));document.getElementById('crumb').textContent=({dashboard:'Overview',sales:'Sales & POS',products:'Products & Inventory',purchases:'Purchases',customers:'Customers',suppliers:'Suppliers',expenses:'Expenses',reports:'Reports',employees:'Employees',settings:'Business settings'})[p];document.getElementById('sidebar').classList.remove('open');render()}
document.querySelectorAll('[data-page]').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
document.getElementById('menuBtn').onclick=()=>document.getElementById('sidebar').classList.toggle('open');
document.getElementById('closeModal').onclick=document.getElementById('cancelModal').onclick=closeModal;
function closeModal(){document.getElementById('modalBack').classList.remove('show')}
function showModal(title,fields,onSave){document.getElementById('modalTitle').textContent=title;document.getElementById('modalFields').innerHTML='<div class="form-grid">'+fields.map(f=>`<div class="field ${f.full?'full':''}"><label>${esc(f.label)}</label>${f.type==='select'?`<select name="${f.name}" ${f.required?'required':''}>${f.options.map(o=>`<option value="${esc(o)}">${esc(o)}</option>`).join('')}</select>`:`<input name="${f.name}" type="${f.type||'text'}" placeholder="${esc(f.placeholder||'')}" ${f.required?'required':''} ${f.step?'step="'+f.step+'"':''} ${f.min!==undefined?'min="'+f.min+'"':''}>`}</div>`).join('')+'</div>';document.getElementById('modalBack').classList.add('show');document.getElementById('modalForm').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target).entries());await onSave(data);closeModal();e.target.reset();render()}}
function pageHeader(title,sub,action=''){return `<div class="page-title"><div><h1>${title}</h1><p>${sub}</p></div>${action}</div>`}
function table(headers,rows){return `<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows||`<tr><td colspan="${headers.length}" class="empty">No records yet. Add your first record to get started.</td></tr>`}</tbody></table></div>`}
async function render(){
 const v=document.getElementById('view');document.getElementById('sideBusiness').textContent=state.business.name;document.getElementById('sideIndustry').textContent=state.business.industry;
 if(state.page==='dashboard'){const [p,s,c,e]=await Promise.all([all('products'),all('sales'),all('customers'),all('expenses')]);const revenue=s.reduce((a,x)=>a+Number(x.total||0),0),cost=e.reduce((a,x)=>a+Number(x.amount||0),0),low=p.filter(x=>Number(x.stock||0)<=Number(x.reorder||0));v.innerHTML=`<div class="welcome"><div><div class="eyebrow">Business command centre</div><h1>Good day. Here's your business overview.</h1><p>Monitor operations, money and stock from one workspace.</p></div><button class="btn gold" id="newSale">＋ Record a sale</button></div><div class="stats"><div class="stat"><div class="stat-head">Total sales <span class="stat-icon">↗</span></div><strong>${money(revenue)}</strong><small>All recorded sales</small></div><div class="stat"><div class="stat-head">Business expenses <span class="stat-icon">⇧</span></div><strong>${money(cost)}</strong><small>All recorded expenses</small></div><div class="stat"><div class="stat-head">Products in catalogue <span class="stat-icon">◇</span></div><strong>${p.length}</strong><small>${low.length} at or below reorder level</small></div><div class="stat"><div class="stat-head">Customers <span class="stat-icon">♙</span></div><strong>${c.length}</strong><small>Registered customers</small></div></div><div class="grid-main"><div><div class="panel"><div class="panel-head"><div><h3>Quick actions</h3><div class="panel-sub">Common tasks for your business</div></div></div><div class="quick-grid"><button class="quick" data-go="sales"><span>🧾</span><b>Record sale</b><small>Capture a transaction</small></button><button class="quick" data-go="products"><span>📦</span><b>Add product</b><small>Update inventory</small></button><button class="quick" data-go="expenses"><span>💳</span><b>Add expense</b><small>Track spending</small></button><button class="quick" data-go="customers"><span>👥</span><b>Add customer</b><small>Build customer list</small></button></div></div><div class="panel"><div class="panel-head"><div><h3>Recent sales</h3><div class="panel-sub">Latest recorded transactions</div></div><button class="btn small" data-go="sales">View all</button></div>${table(['Receipt','Customer','Date','Total'],s.slice(-5).reverse().map(x=>`<tr><td>${esc(x.receipt||'—')}</td><td>${esc(x.customer||'Walk-in')}</td><td>${esc(x.date||'')}</td><td><b>${money(x.total)}</b></td></tr>`).join(''))}</div></div><div><div class="panel"><div class="panel-head"><div><h3>Stock attention</h3><div class="panel-sub">Items needing a restock review</div></div><span class="pill ${low.length?'warn':''}">${low.length} items</span></div>${low.length?table(['Product','In stock'],low.slice(0,6).map(x=>`<tr><td>${esc(x.name)}</td><td><span class="pill warn">${x.stock} ${esc(x.unit||'units')}</span></td></tr>`).join('')):'<div class="empty">No low-stock items. Add products and reorder levels to monitor stock.</div>'}</div><div class="panel"><h3>Business profile</h3><div class="panel-sub" style="margin:7px 0 12px">Your workspace is configured for multiple industries.</div><div class="industry-tags"><span class="tag">Retail</span><span class="tag">Pharmacy</span><span class="tag">Hospitality</span><span class="tag">Wholesale</span><span class="tag">Services</span><span class="tag">Distribution</span><span class="tag">Other SMEs</span></div><button class="btn small" style="margin-top:14px" data-go="settings">Configure business</button></div></div></div>`;document.getElementById('newSale').onclick=()=>setPage('sales');v.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>setPage(b.dataset.go));return}
 if(state.page==='settings'){v.innerHTML=pageHeader('Business settings','Configure your organisation profile and operating preferences')+`<div class="panel"><div class="notice">Cloud sign-in and multi-business workspaces are now available. Sales, inventory and other operational records still remain local to this device until the secure cloud-sync phase is completed.</div><form id="settingsForm"><div class="form-grid"><div class="field"><label>Business name</label><input name="name" required value="${esc(state.business.name)}"></div><div class="field"><label>Industry profile</label><select name="industry">${['Multi-industry','Retail','Pharmacy','Wholesale & Distribution','Hardware & Building Materials','Restaurant & Hospitality','Professional Services','Healthcare','Education','Transport & Logistics','Other'].map(x=>`<option ${state.business.industry===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Default currency</label><select name="currency">${['SLE','USD','LRD','GNF','GHS','NGN','EUR','GBP'].map(x=>`<option ${state.business.currency===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Business email</label><input name="email" type="email" value="${esc(state.business.email)}"></div><div class="field"><label>Phone number</label><input name="phone" value="${esc(state.business.phone)}"></div><div class="field"><label>Business address</label><input name="address" value="${esc(state.business.address)}"></div></div><div style="margin-top:18px"><button class="btn primary">Save business profile</button></div></form></div><div class="panel"><h3>Data tools</h3><p class="panel-sub">Export a local JSON backup or restore a previously exported backup.</p><div class="toolbar" style="margin-top:14px"><button class="btn" id="backupBtn">Export backup</button><label class="btn" for="restoreFile">Restore backup</label><input id="restoreFile" type="file" accept="application/json" hidden></div></div>`;document.getElementById('settingsForm').onsubmit=async e=>{e.preventDefault();state.business=Object.fromEntries(new FormData(e.target).entries());await setting('business',state.business);render();toast('Business profile saved')};document.getElementById('backupBtn').onclick=backup;document.getElementById('restoreFile').onchange=restore;return}
 const config={
 products:{store:'products',title:'Products & Inventory',sub:'Manage your catalogue, stock quantities and reorder levels',fields:[['name','Product name','text',1],['sku','SKU / item code','text'],['category','Category','text'],['unit','Unit (e.g. piece, box, kg)','text'],['cost','Cost price','number'],['price','Selling price','number'],['stock','Opening stock','number'],['reorder','Reorder level','number']]},
 customers:{store:'customers',title:'Customers',sub:'Maintain customer details and relationship records',fields:[['name','Customer name','text',1],['phone','Phone number','text'],['email','Email','email'],['address','Address','text']]},
 suppliers:{store:'suppliers',title:'Suppliers',sub:'Manage supplier contacts and purchasing relationships',fields:[['name','Supplier name','text',1],['phone','Phone number','text'],['email','Email','email'],['address','Address','text']]},
 expenses:{store:'expenses',title:'Expenses',sub:'Record operating costs and business spending',fields:[['description','Expense description','text',1],['category','Category','text'],['amount','Amount','number',1],['date','Date','date',1],['reference','Reference / receipt no.','text']]},
 employees:{store:'employees',title:'Employees',sub:'Maintain your staff directory (permissions and payroll arrive in a later phase)',fields:[['name','Employee full name','text',1],['role','Job title','text'],['phone','Phone number','text'],['email','Email','email']]}
 };

createdAt=new Date().toISOString();await put(c.store,d);toast('Record saved')});v.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this record?')){await del(c.store,b.dataset.del);render();toast('Record deleted')}});document.getElementById('filter').oninput=e=>{const q=e.target.value.toLowerCase();v.querySelectorAll('tbody tr').forEach(r=>r.style.display=r.textContent.toLowerCase().includes(q)?'':'none')};return}

 if(state.page==='purchases'){const [purchases,products,suppliers]=await Promise.all([all('purchases'),all('products'),all('suppliers')]);v.innerHTML=pageHeader('Purchases','Record stock purchases from suppliers',`<button class="btn primary" id="addPurchase">＋ Record purchase</button>`)+`<div class="panel">${table(['Date','Supplier','Product','Quantity','Unit cost','Total'],purchases.slice().reverse().map(x=>`<tr><td>${esc(x.date)}</td><td>${esc(x.supplier)}</td><td>${esc(x.product)}</td><td>${x.quantity}</td><td>${money(x.cost)}</td><td><b>${money(x.total)}</b></td></tr>`).join(''))}</div>`;document.getElementById('addPurchase').onclick=()=>{if(!products.length){toast('Add products first');return}showModal('Record purchase',[{name:'productId',label:'Product',type:'select',options:products.map(p=>String(p.id)+'|'+p.name)},{name:'supplier',label:'Supplier',type:'select',options:['Not specified',...suppliers.map(s=>s.name)]},{name:'quantity',label:'Quantity received',type:'number',required:true,step:'0.01',min:0.01},{name:'cost',label:'Unit cost',type:'number',required:true,step:'0.01',min:0},{name:'date',label:'Purchase date',type:'date',required:true}],async d=>{const [id]=d.productId.split('|'),p=products.find(x=>x.id===Number(id)),qty=Number(d.quantity),cost=Number(d.cost);p.stock=Number(p.stock||0)+qty;p.cost=cost;await put('products',p);await put('purchases',{date:d.date,supplier:d.supplier,product:p.name,productId:p.id,quantity:qty,cost,total:qty*cost});toast('Purchase recorded; stock increased')})};return}

async function backup(){const data={business:state.business,exportedAt:new Date().toISOString(),records:{}};for(const s of stores)data.records[s]=await all(s);const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='white-lion-sme-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
async function restore(e){const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.records)throw Error('Invalid backup');for(const s of stores){const tx=db.transaction(s,'readwrite');tx.objectStore(s).clear();for(const r of (data.records[s]||[]))tx.objectStore(s).put(r)}if(data.business){state.business=data.business;await setting('business',state.business)}toast('Backup restored');render()}catch(err){alert('Could not restore this backup: '+err.message)}e.target.value=''}
