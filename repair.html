<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>White Lion — Safe app repair</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f7f4;color:#183326;font:16px system-ui;padding:22px;box-sizing:border-box}
main{max-width:520px;background:#fff;border:1px solid #dcebe1;border-radius:18px;padding:26px;box-shadow:0 12px 38px #102a1c12}
h1{font-size:22px;margin:0 0 10px}p{line-height:1.6;color:#52645a}strong{color:#087a43}
</style>
</head>
<body>
<main>
<h1>Repairing White Lion app loading</h1>
<p id="status">Removing only the old application cache and service-worker registration. Your business records and sign-in data are not being cleared.</p>
<p><strong>Please keep this page open.</strong> It will return you to the latest app automatically.</p>
</main>
<script>
(async function(){
 const status=document.getElementById('status');
 try{
  if('serviceWorker' in navigator){
   const registrations=await navigator.serviceWorker.getRegistrations();
   await Promise.all(registrations.map(reg=>reg.unregister()));
  }
  if('caches' in window){
   const keys=await caches.keys();
   await Promise.all(keys.filter(key=>key.startsWith('white-lion-sme-')).map(key=>caches.delete(key)));
  }
  status.textContent='Old application files cleared safely. Opening the latest White Lion app…';
 }catch(error){
  status.textContent='The browser could not automatically clear its old app cache. Opening the latest app anyway…';
 }
 setTimeout(function(){location.replace('./?safe-refresh=20261109')},1200);
})();
</script>
</body>
</html>
