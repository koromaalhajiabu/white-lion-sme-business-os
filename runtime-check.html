<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>White Lion Runtime Check</title><style>body{font:14px system-ui;background:#f3f6f4;color:#193326;margin:0;padding:12px}h2{font-size:20px}p{line-height:1.5}button{padding:11px 15px;border:0;border-radius:8px;background:#087a43;color:white;font-weight:700}#report{white-space:pre-wrap;overflow-wrap:anywhere;background:#fff;padding:12px;border-radius:10px;min-height:110px}iframe{width:100%;height:68vh;border:2px solid #8ca99a;border-radius:10px;background:white}small{color:#52665a}</style></head><body><h2>White Lion · Runtime Button Check</h2><p>This opens the live app inside this test page. It only observes startup and taps; it does not alter records. Wait for the app to appear, then tap one button inside it.</p><button id="reload">Reload test</button> <button id="inspect">Inspect app status</button><p id="report">Loading the live app…</p><iframe id="app" title="Live White Lion app" src="./?runtimecheck=20261109"></iframe><script>
const frame=document.getElementById('app'),report=document.getElementById('report');let lines=[];
function log(x){lines.push(x);report.textContent=lines.slice(-30).join('\\n')}
function inspect(){try{const w=frame.contentWindow,d=frame.contentDocument;log('--- APP STATUS ---');log('URL: '+w.location.href);log('Startup complete: '+w.__wlStartupComplete);log('Script failures: '+JSON.stringify(w.__wlScriptFail||[]));log('Startup error: '+(w.__wlStartupError||'none'));log('View exists: '+!!d.getElementById('view'));log('View text: '+(d.getElementById('view')?.innerText||'').slice(0,220).replace(/\\n/g,' | '));log('Buttons found: '+d.querySelectorAll('button').length);const b=d.querySelector('button');if(b){const r=b.getBoundingClientRect(),x=Math.max(1,Math.min(w.innerWidth-1,r.left+r.width/2)),y=Math.max(1,Math.min(w.innerHeight-1,r.top+r.height/2));log('First button: '+(b.innerText||b.id||'(unnamed)')+'; visible='+!!(r.width&&r.height)+'; top element at centre='+((d.elementFromPoint(x,y)?.outerHTML||'none').slice(0,180)))}}catch(e){log('Inspection error: '+e.message)}}
frame.addEventListener('load',()=>{log('App frame loaded.');try{const w=frame.contentWindow,d=frame.contentDocument;w.addEventListener('error',e=>log('RUNTIME ERROR: '+e.message+' at '+e.filename+':'+e.lineno));w.addEventListener('unhandledrejection',e=>log('PROMISE ERROR: '+String(e.reason)));d.addEventListener('pointerdown',e=>{const top=d.elementFromPoint(e.clientX,e.clientY);log('TAP observed: target='+(e.target.id||e.target.tagName)+'; top element='+(top?.id||top?.tagName)+'; topHTML='+(top?.outerHTML||'').slice(0,140))},true);inspect()}catch(e){log('Could not attach observers: '+e.message)}});
document.getElementById('inspect').onclick=inspect;document.getElementById('reload').onclick=()=>{lines=[];report.textContent='Reloading…';frame.src='./?runtimecheck='+Date.now()};
</script></body></html>
