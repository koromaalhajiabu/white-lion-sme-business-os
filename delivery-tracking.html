<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#087a43"><title>Track Delivery | White Lion</title><style>body{margin:0;background:#f3f7f4;color:#183326;font:15px/1.5 system-ui,Arial}header{background:linear-gradient(135deg,#075b35,#0d7544);color:#fff;padding:28px 18px}main{max-width:700px;margin:25px auto;padding:0 15px}.panel{background:#fff;border:1px solid #dfe9e2;border-radius:16px;padding:20px;box-shadow:0 10px 30px #0a4b2810}.muted{color:#718078;font-size:12px}.status{font-size:22px;font-weight:800;text-transform:capitalize;color:#087a43}.event{padding:12px 0;border-bottom:1px solid #edf2ee}.event:last-child{border:0}input,button{font:inherit;padding:11px;border-radius:9px;border:1px solid #dce7df}button{background:#087a43;color:white;border:0;font-weight:700}</style></head><body><header><b>WHITE LION · DELIVERY TRACKING</b><p>Follow your order's delivery progress.</p></header><main><div class="panel"><div id="result">Loading tracking information…</div></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
(async()=>{const out=document.getElementById('result');try{const sb=supabase.createClient('https://nclncqlgnxnijlumznnt.supabase.co','sb_publishable_iPIsAysPnlvPCAoqntoNRg_dKcSZxKX',{auth:{persistSession:false}});const code=new URLSearchParams(location.search).get('code');if(!code)throw Error('Tracking code is missing.');const {data,error}=await sb.rpc('get_public_delivery_tracking',{p_tracking_code:code});if(error)throw error;if(data.status!=='success')throw Error('We could not find this tracking number.');const t=data.tracking;out.innerHTML='<h2>Order '+t.order_number+'</h2><div class="status">'+t.delivery_status.replaceAll('_',' ')+'</div><p class="muted">Tracking reference: '+t.tracking_code+'</p><p><b>Delivery address</b><br>'+t.delivery_address+'</p><p><b>Rider</b><br>'+(t.rider_name||'Not yet assigned')+(t.rider_phone?' · '+t.rider_phone:'')+'</p><h3>Delivery updates</h3>'+(t.events||[]).map(e=>'<div class="event"><b>'+e.status.replaceAll('_',' ')+'</b><div class="muted">'+new Date(e.at).toLocaleString()+'</div>'+(e.note||'')+'</div>').join('')||'<p>No updates yet.</p>'}catch(e){out.textContent=e.message||String(e)}})();
</script></body></html>
