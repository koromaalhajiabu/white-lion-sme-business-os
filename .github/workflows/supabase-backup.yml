name: Supabase off-site backup

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/supabase-backup.yml"
  schedule:
    - cron: "30 2 * * *"

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Verify required secrets
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          test -n "$SUPABASE_DB_URL" || (echo "Missing SUPABASE_DB_URL secret" && exit 1)
          test -n "$SUPABASE_URL" || (echo "Missing SUPABASE_URL secret" && exit 1)
          test -n "$SUPABASE_SERVICE_ROLE_KEY" || (echo "Missing SUPABASE_SERVICE_ROLE_KEY secret" && exit 1)

      - name: Export database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backup/database
          # Rebuild the URI safely so passwords containing @, #, /, %, brackets,
          # colons, or other reserved characters cannot corrupt the hostname.
          # The regex anchors on Supabase's pooler domain and captures the
          # complete password before that known host. Credentials are never printed.
          DB_CONN="$(python3 - <<'PY'
          import os
          import re
          from urllib.parse import quote, unquote

          raw = os.environ["SUPABASE_DB_URL"].strip()
          pattern = re.compile(
              r"^(postgres(?:ql)?://)([^:/@]+):(.+)@([^/@]+\.pooler\.supabase\.com)(:\d+/[^?#]*(?:\?[^#]*)?)$",
              re.IGNORECASE,
          )
          match = pattern.match(raw)
          if not match:
              raise SystemExit(
                  "SUPABASE_DB_URL must be a valid Supabase Session Pooler URI "
                  "with a hostname ending in .pooler.supabase.com and port 5432."
              )

          scheme, username, password, host, suffix = match.groups()
          # Supabase shared Session Pooler requires postgres.[PROJECT_REF].
          # Accept a pasted URI with plain "postgres" and correct it safely.
          project_ref = "nclncqlgnxnijlumznnt"
          if username.lower() == "postgres":
              username = f"postgres.{project_ref}"
          elif username.lower() != f"postgres.{project_ref}":
              raise SystemExit(
                  "SUPABASE_DB_URL username must be postgres."
                  + project_ref
                  + " for this project's shared Session Pooler."
              )

          # Decode once then encode exactly once; this handles both raw and
          # already-percent-encoded passwords without double-encoding.
          encoded_password = quote(unquote(password), safe="")
          rebuilt = f"{scheme}{username}:{encoded_password}@{host}{suffix}"
          rebuilt = re.sub(
              r"(?i)(?<![A-Za-z0-9_])database=",
              "dbname=",
              rebuilt,
          )
          print(rebuilt)
          PY
          )"
          pg_dump "$DB_CONN" --format=custom --compress=6 --no-owner --no-privileges --file="backup/database/white-lion-${GITHUB_RUN_ID}.dump"
          pg_restore --list "backup/database/white-lion-${GITHUB_RUN_ID}.dump" > "backup/database/white-lion-${GITHUB_RUN_ID}.contents.txt"

      - name: Back up private business documents
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SUPABASE_BACKUP_BUCKET: business-documents
          BACKUP_STORAGE_DIR: backup/storage
        run: python3 scripts/backup_supabase_storage.py

      - name: Create backup manifest
        run: |
          printf 'Repository: %s\\nCommit: %s\\nRun: %s\\nCreated UTC: %s\\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > backup/MANIFEST.txt

      - name: Encrypt complete backup before artifact upload
        env:
          BACKUP_ENCRYPTION_PASSPHRASE: ${{ secrets.BACKUP_ENCRYPTION_PASSPHRASE }}
        run: |
          test -n "$BACKUP_ENCRYPTION_PASSPHRASE" || (echo "Missing BACKUP_ENCRYPTION_PASSPHRASE secret" && exit 1)
          tar -czf /tmp/white-lion-backup.tar.gz backup/
          openssl enc -aes-256-cbc -salt -pbkdf2 -iter 600000 \
            -in /tmp/white-lion-backup.tar.gz \
            -out white-lion-supabase-backup.tar.gz.enc \
            -pass env:BACKUP_ENCRYPTION_PASSPHRASE
          sha256sum white-lion-supabase-backup.tar.gz.enc > white-lion-supabase-backup.tar.gz.enc.sha256
          openssl dgst -sha256 -hmac "$BACKUP_ENCRYPTION_PASSPHRASE" white-lion-supabase-backup.tar.gz.enc > white-lion-supabase-backup.tar.gz.enc.hmac
          rm -rf backup/ /tmp/white-lion-backup.tar.gz

      - name: Upload encrypted backup artifact only
        uses: actions/upload-artifact@v4
        with:
          name: white-lion-supabase-backup-${{ github.run_id }}
          path: |
            white-lion-supabase-backup.tar.gz.enc
            white-lion-supabase-backup.tar.gz.enc.sha256
            white-lion-supabase-backup.tar.gz.enc.hmac
          retention-days: 30
          if-no-files-found: error
