name: Browser interaction smoke test

on:
  push:
    paths:
      - '**/*.js'
      - '**/*.html'
      - '**/*.css'
      - 'manifest.webmanifest'
      - 'sw.js'
      - 'scripts/browser-smoke.mjs'
      - '.github/workflows/browser-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Serve the current branch build locally
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/white-lion-http.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:4173/ >/dev/null
      - name: Test current branch on Android-sized and desktop viewports
        env:
          WHITE_LION_SMOKE_URL: http://127.0.0.1:4173/
        run: node scripts/browser-smoke.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: white-lion-browser-smoke-evidence
          path: |
            browser-smoke-report.json
            browser-android-mobile.png
            browser-desktop.png
          if-no-files-found: warn
          retention-days: 7
