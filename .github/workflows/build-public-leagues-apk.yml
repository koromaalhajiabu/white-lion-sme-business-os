name: Build and Publish Public Leagues Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'public-leagues-android/**'
      - 'public-leagues.html'
      - 'icons/public-leagues-app-icon.jpg'
      - '.github/workflows/build-public-leagues-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate standard Android launcher icon sizes from the repository crest
        run: |
          python -m pip install --quiet Pillow
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          source = Image.open("icons/public-leagues-app-icon.jpg").convert("RGBA")
          sizes = {"mdpi":48,"hdpi":72,"xhdpi":96,"xxhdpi":144,"xxxhdpi":192}
          for density, size in sizes.items():
              folder = Path(f"public-leagues-android/app/src/main/res/mipmap-{density}")
              folder.mkdir(parents=True, exist_ok=True)
              icon = source.resize((size, size), Image.Resampling.LANCZOS)
              icon.save(folder / "ic_launcher.png", optimize=True)
          PY
      - name: Provide launcher crest resource for legacy icon reference
        run: |
          mkdir -p public-leagues-android/app/src/main/res/drawable-nodpi
          cp icons/public-leagues-app-icon.jpg public-leagues-android/app/src/main/res/drawable-nodpi/white_lion_crest.jpg
      - name: Build APK
        working-directory: public-leagues-android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p output
          cp public-leagues-android/app/build/outputs/apk/debug/app-debug.apk output/WhiteLion-Public-Leagues.apk
      - name: Upload downloadable APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: WhiteLion-Public-Leagues-APK
          path: output/WhiteLion-Public-Leagues.apk
          if-no-files-found: error
          retention-days: 90
      - name: Publish APK as a public GitHub Release download
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="public-leagues-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" output/WhiteLion-Public-Leagues.apk \
            --title "White Lion Public Leagues Android App" \
            --notes "Standalone Android app for the public read-only leagues directory. Built from the koromaalhajiabu/white-lion-sme-business-os repository." \
            --latest
