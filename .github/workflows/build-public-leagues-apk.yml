name: Build Public Leagues Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'public-leagues-android/**'
      - '.github/workflows/build-public-leagues-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: public-leagues-android
        run: gradle --no-daemon assembleDebug
      - name: Rename APK
        run: |
          mkdir -p output
          cp public-leagues-android/app/build/outputs/apk/debug/app-debug.apk output/WhiteLion-Public-Leagues.apk
      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: WhiteLion-Public-Leagues-APK
          path: output/WhiteLion-Public-Leagues.apk
          if-no-files-found: error
          retention-days: 90
